{% extends "room_base.html" %}
{% block tab_content %}
<section class="card">
  <h2>교실</h2>
  <form method="post" action="{{ url_for('room.update_settings', code=code) }}" id="settings-form">
    <label class="field">열 수 ({{ min_cols }}~{{ max_cols }})
      <input id="cols-input" type="number" name="cols" min="{{ min_cols }}" max="{{ max_cols }}"
             value="{{ counts|length }}" oninput="syncColInputs()">
    </label>

    <p class="muted small">열마다 행 수를 직접 입력 · 1열 = 가장 왼쪽 줄 · 1행 = 칠판 쪽</p>
    <div id="row-inputs" class="row-inputs">
      {% for n in counts %}
      <span class="col-cell">
        <label>{{ loop.index }}열
          <input class="row-input" type="number" min="{{ min_rows }}" max="{{ max_rows }}"
                 name="row_{{ loop.index }}" value="{{ n }}">
        </label>
      </span>
      {% endfor %}
    </div>

    <p class="{{ 'ok-text' if seatcount_ok else 'bad-text' }}">{{ seatcount_msg }}</p>

    <label class="field">지난 자리 회피 — 최근
      <input type="number" name="lookback" min="0" max="{{ max_lookback }}" value="{{ room['lookback'] }}">
      회차
    </label>
    <p class="muted small">0이면 회피 없이 순수 무작위</p>

    <button type="submit" class="btn">교실 설정 저장</button>
  </form>
</section>

<script>
function syncColInputs() {
  const colsInput = document.getElementById('cols-input');
  const container = document.getElementById('row-inputs');
  const min = parseInt(colsInput.min, 10);
  const max = parseInt(colsInput.max, 10);
  let target = parseInt(colsInput.value || '0', 10) || min;
  target = Math.max(min, Math.min(max, target));

  const cells = Array.from(container.querySelectorAll('.col-cell'));
  const current = cells.length;

  if (target > current) {
    const fallback = current > 0 ? cells[current - 1].querySelector('.row-input').value : '3';
    for (let i = current + 1; i <= target; i++) {
      const wrap = document.createElement('span');
      wrap.className = 'col-cell';
      wrap.innerHTML = '<label>' + i + '열 <input class="row-input" type="number" min="{{ min_rows }}" max="{{ max_rows }}" name="row_' + i + '" value="' + fallback + '"></label>';
      container.appendChild(wrap);
    }
  } else if (target < current) {
    for (let i = current; i > target; i--) {
      cells[i - 1].remove();
    }
  }
}
</script>
{% endblock %}
