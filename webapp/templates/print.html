<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>인쇄 · 자리바꾸기</title>
  <style>
    body { margin: 0; padding: 24px; background: #fff; text-align: center; font-family: "맑은 고딕", sans-serif; }
    img { max-width: 100%; height: auto; }
    .no-print { margin-top: 16px; color: #6e7684; }
    @media print {
      .no-print { display: none; }
    }
  </style>
</head>
<body>
  <img src="{{ url_for('room.print_png', code=code) }}" alt="자리 배치도">
  <p class="no-print">인쇄 대화상자가 자동으로 열리지 않으면 Ctrl+P를 눌러주세요.</p>
  <script>
    window.onload = function () {
      window.print();
    };
  </script>
</body>
</html>
